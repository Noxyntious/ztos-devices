[device]
codename = "xiaomi-land"
name = "Xiaomi Redmi 3S"
arch = "aarch64"
status = "untested"
origin = "pmos"

[source.pmos]
pmaports_commit = "2254bfcf53d13d79136e9c5187480a3582f32cad"
# no device-xiaomi-land: postmarketOS runs land on its generic msm89x7 port
# (lk2nd + extlinux), whose kernel picks land's device tree
device_pkg = "device-qcom-msm89x7"
kernel_pkg = "linux-postmarketos-qcom-msm89x7"
# Adreno 505's microcode; Wi-Fi and DSP firmware are read off the phone's own
# partitions by msm-firmware-loader (overlay)
firmware_pkgs = ["firmware-qcom-adreno-a530", "firmware-qcom-msm89x7"]
category = "testing"

[kernel]
mainline = true
version = "7.1.3"
artifacts_sha256 = "d310c7a9da9daef8499b4a5e738b7e4052ca0224f6669445cf89e7993d44e4bc"
soc = "msm8937"
gpu_driver = "freedreno"

[boot]
flash_method = "fastboot"
# lk2nd is only picked by itself for Samsung phones: named here. It stays on
# boot and boots extlinux from the boot partition inside userdata
lk2nd = "lk2nd-msm8952"
bootimg_header_version = 0
kernel_offset = "0x00008000"
ramdisk_offset = "0x01000000"
tags_offset = "0x00000100"
base = "0x80000000"
second_offset = "0x00f00000"
pagesize = 2048
# one dtb: the generic port lists globs, and ztConflo takes the first word
dtb = "qcom/msm8937-xiaomi-land"
cmdline = "quiet loglevel=2"
append_dtb = true
qcdt = false
sparse = true
rootfs_target = "userdata"
# The modem, which msm89x7-mainline's land device tree leaves off: switched on
# as its msm8937/8917 siblings do (msm8917-xiaomi-ugglite: the modem with
# PM8937 S1 and L7, its memory, memshare, bam-dmux for mobile data)
dtb_enable = [
	"/soc@0/remoteproc@4080000",
	"/soc@0/remoteproc@4080000/bam-dmux",
	"/soc@0/dma-controller@4044000",
	"/reserved-memory/mpss@86800000",
	"/reserved-memory/mba",
	"/reserved-memory/gps",
	"/memshare",
]
dtb_set = [
	# 80 MiB, land's own downstream size (msm8937.dtsi's modem_region)
	["/reserved-memory/mpss@86800000", "reg", "x", "0 0x86800000 0 0x5000000"],
	# S1 has no phandle in this dtb (nothing referenced it): one of its own
	["/remoteproc/smd-edge/rpm-requests/regulators-0/s1", "phandle", "x", "0xfff0"],
	["/soc@0/remoteproc@4080000", "mss-supply", "x", "0xfff0"],
	# L7's phandle in this dtb: recheck it (and S1's freedom) when the kernel
	# changes, as artifacts_sha256 will
	["/soc@0/remoteproc@4080000", "pll-supply", "x", "0x24"],
]
defaulted = ["bootimg_header_version"]

[userspace]
# msm-firmware-loader before udev, so the Wi-Fi, modem and audio DSPs find their
# firmware at boot; rmtfs, the modem's file system; msm-modem-uim-selection
# selects the SIM and msm-modem-wwan-port opens the bam-dmux data port, both
# before ModemManager (pmOS's soc-qcom-msm89x7-modem). ztos-virtualkeyd: the
# capacitive keys (overlay etc/ztos/virtualkeys.conf)
daemons = ["msm-firmware-loader", "msm-firmware-loader-unpack", "rmtfs", "msm-modem-uim-selection",
           "msm-modem-wwan-port", "bluetooth", "ztos-virtualkeyd"]

[ztmetro]
# 720 px wide: ztMETRO's 360 points across
scale = 2.0
vibrator = "auto"
rotation = 0

[verified]
date = ""
by = ""
checklist = {}
