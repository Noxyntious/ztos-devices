# ztos-virtualkeyd: the three capacitive keys under the Redmi 3S's glass. The
# FT5306 reports them as touches below its 720x1280 panel, at y = 2000 and
# x = 180, 540 and 900 (measured on the phone). From the left: menu (Search
# and Hyperscan in ztMETRO), home (Start), back.
device = generic ft5x06 (f1)
key = KEY_MENU 0 1280 359 2400
key = KEY_HOMEPAGE 360 1280 719 2400
key = KEY_BACK 720 1280 1079 2400
